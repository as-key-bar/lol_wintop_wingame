[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wintop-wingame-api"
version = "0.1.0"
description = "API for the wintop-wingame matchup guide"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2.0",
    "cryptography>=42.0",
    "fastapi>=0.115,<1.0",
    "pymysql>=1.1,<2.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.0,<9.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
app = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
